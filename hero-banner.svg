<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img">
<title>Hitman-886 — Living Identity</title>
<desc>Animated colored ASCII portrait and name. REPOSITORIES: 4. STARS: 0. CONTRIBUTIONS: 32. FOLLOWERS: 0</desc>
<defs>
  <linearGradient id="edge"><stop stop-color="#00F0FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#00F0FF" stroke-opacity=".12"/></pattern>
  <pattern id="ascii" width="5" height="7" patternUnits="userSpaceOnUse"><text y="6" font-family="monospace" font-size="7" fill="#00F0FF">#</text></pattern>
  <radialGradient id="halo"><stop stop-color="#00F0FF" stop-opacity=".25"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
  <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<style>
@keyframes arrive{0%,5%{opacity:0;transform:translateY(18px)}24%,92%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes name{0%,18%{opacity:0;transform:translateX(-15px)}34%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:.9}30%{transform:translateY(330px);opacity:0}100%{transform:translateY(330px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.35}}
.portrait{animation:arrive 16s ease-in-out infinite}.name{animation:name 16s ease-in-out infinite}.scan{animation:scan 16s linear infinite}.orbit{transform-origin:790px 250px;animation:orbit 48s linear infinite}.pulse{animation:breathe 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.portrait,.name,.scan,.orbit,.pulse{animation:none}.scan{display:none}}
</style>
