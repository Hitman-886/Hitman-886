<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><title>A universe of work</title><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes twinkle{50%{fill-opacity:.35}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{0%{stroke-dashoffset:1}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.orbit{animation:orbit 18s linear infinite}.flow{animation:flow 5s linear infinite}
.twinkle{animation:twinkle 4s ease-in-out infinite}.reveal{animation:reveal .8s ease-out backwards}
.draw{stroke-dasharray:1;animation:draw 7s ease-in-out infinite}
@keyframes pulse{50%{fill-opacity:.32;stroke-opacity:.5}}@keyframes beam{to{stroke-dashoffset:-900}}.pulse{animation:pulse 6s ease-in-out infinite}.beam{animation:beam 12s linear infinite}@media(prefers-reduced-motion:reduce){.pulse,.beam,.orbit,.flow,.twinkle,.reveal,.draw{animation:none}.draw{stroke-dasharray:none}}</style><rect width="1000" height="490" rx="24" fill="#080c18"/><rect x="1" y="1" width="998" height="488" rx="23" fill="none" stroke="#779dff" stroke-opacity=".3"/><g font-family="monospace"><text x="40" y="43" fill="#93a6c4" font-size="11" letter-spacing="3">PROJECT CONSTELLATION</text><text x="40" y="83" fill="#edf4ff" font-size="26">A universe of work</text>
<circle class="orbit" style="transform-origin:500px 240px" stroke-dasharray="22 12" cx="500" cy="240" r="72" fill="none" stroke="#779dff" stroke-opacity=".3"/>
<circle class="pulse" style="animation-delay:0s" cx="500" cy="240" r="60" fill="#779dff" fill-opacity=".18" stroke="#779dff"/>
<rect x="487" y="227" width="26" height="26" rx="6.5" fill="#779dff" fill-opacity=".16" stroke="#779dff" stroke-opacity=".58"/><text x="500" y="244.16" text-anchor="middle" fill="#779dff" font-family="monospace" font-weight="900" font-size="11.96">OP</text>
<text x="500" y="336" text-anchor="middle" fill="#edf4ff" font-size="18">Hitman-886</text>
<text x="500" y="357" text-anchor="middle" fill="#93a6c4" font-size="11">Open source · 0 stars</text><path class="flow" d="M40 112H960" stroke="#779dff" stroke-opacity=".3" stroke-dasharray="8 18" fill="none"/></g></svg>
